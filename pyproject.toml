[project]
name = "mailgate"
version = "0.1.0"
description = "Air-gapped secure email intermediary for Gmail — programmatic read/search/reply/send with OTP/2FA redaction."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Phil Bird" }]
keywords = ["gmail", "email", "imap", "smtp", "fastapi", "security", "otp", "2fa"]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "imapclient>=3.0",
    "html2text>=2024.2.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[project.scripts]
mailgate = "mailgate.server:main"
mailgate-provision = "mailgate.provision:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mailgate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
